<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>城灯初上</title>
<style>
html,body{margin:0;padding:0;background:#0b1122;overflow:hidden}
canvas{display:block;margin:0;width:1280px;height:720px}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
window.CFG={outW:1280,outH:720,fps:24,dur:8};
window.READY=false;
(function(){
const W=1280,H=720,SW=1080,SH=1920;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let img=null,comp,cctx,glow,halo,refl,ok=false;
const TS=30,RY0=470,RY1=1270;
// 人物（含手与裙摆）保护框，源图坐标
const PERSON={x:325,y:745,w:330,h:870};
// 河面多边形（源图坐标）
const RIVER=[[592,750],[645,750],[840,810],[1080,900],[1080,1058],[960,1050],[840,990],[750,915],[675,840],[600,772]];
function hash(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function ss(a,b,x){x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x);}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function riverPath(g){g.beginPath();RIVER.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();}

function prepare(){
  comp=mk(SW,SH);cctx=comp.getContext('2d');
  // 窗灯层：用原图像素自身提亮暖光（亮度压暗后高对比，暗部归零）
  glow=mk(SW,SH);let g=glow.getContext('2d');
  g.filter='brightness(0.72) contrast(3.2) saturate(1.3)';
  g.drawImage(img,0,0);g.filter='none';
  g.globalCompositeOperation='destination-in';
  g.fillStyle='#fff';g.fillRect(0,RY0,SW,RY1-RY0);
  g.globalCompositeOperation='destination-out';
  g.fillRect(PERSON.x,PERSON.y,PERSON.w,PERSON.h);
  riverPath(g);g.fill();
  g.globalCompositeOperation='source-over';
  // 柔光晕
  halo=mk(SW,SH);g=halo.getContext('2d');
  g.filter='blur(9px)';g.drawImage(glow,0,0);g.filter='none';
  g.globalCompositeOperation='destination-out';
  g.fillRect(PERSON.x-4,PERSON.y-4,PERSON.w+8,PERSON.h+8);
  g.globalCompositeOperation='source-over';
  // 河面倒影层
  refl=mk(SW,SH);g=refl.getContext('2d');
  g.filter='brightness(0.82) contrast(2.4) saturate(1.2)';
  g.drawImage(img,0,0);g.filter='none';
  g.globalCompositeOperation='destination-in';
  riverPath(g);g.fill();
  g.globalCompositeOperation='source-over';
}

function composeScene(t){
  const c=cctx;
  c.globalCompositeOperation='source-over';c.globalAlpha=1;
  c.drawImage(img,0,0);
  c.globalCompositeOperation='lighter';
  // 窗灯：远处天际线先亮，逐层推向近岸；结尾逐片回到原图亮度
  let idx=0;
  for(let y=RY0;y<RY1;y+=TS){
    const depth=(y-RY0)/(RY1-RY0);
    for(let x=0;x<SW;x+=TS,idx++){
      const arr=0.5+2.6*depth+0.9*hash(idx);
      const on=ss(arr,arr+0.6,t);
      if(on<=0)continue;
      const offAt=5.7+1.6*hash(idx+997);
      const off=1-ss(offAt,offAt+0.5,t);
      const tw=0.86+0.14*Math.sin(2*Math.PI*(2*t/8)+hash(idx+31)*6.283);
      const a=0.6*on*off*tw;
      if(a<=0.003)continue;
      c.globalAlpha=a;
      const w=Math.min(TS,SW-x),h=Math.min(TS,RY1-y);
      c.drawImage(glow,x,y,w,h,x,y,w,h);
    }
  }
  const G=ss(0.8,3.6,t)*(1-ss(5.8,7.8,t));
  if(G>0.002){c.globalAlpha=0.42*G;c.drawImage(halo,0,0);}
  // 河面：近岸灯到达后，倒影增强并更明显地碎动
  const R=ss(2.2,3.9,t)*(1-ss(6.1,7.9,t));
  const base=0.16+0.42*R;
  const amp=1.4+3.2*R;
  const y0=748,y1=1060,x0=590,ww=SW-590;
  for(let y=y0;y<y1;y+=3){
    const ph=2*Math.PI*(y/17-2*t/8);
    const dx=amp*Math.sin(ph)+0.8*amp*Math.sin(2*Math.PI*(y/7.3+3*t/8)+1.3);
    const fl=0.75+0.25*Math.sin(2*Math.PI*(y/11+t/8)*1+0.7);
    c.globalAlpha=base*fl;
    c.drawImage(refl,x0,y,ww,3,x0+dx,y,ww,3);
  }
  c.globalAlpha=1;c.globalCompositeOperation='source-over';
}

function bg(){
  const gr=ctx.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'#16213f');gr.addColorStop(0.6,'#0f1730');gr.addColorStop(1,'#0a0f1f');
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
}
function panel(x,y,w,h){
  ctx.save();ctx.shadowColor='rgba(0,0,0,0.55)';ctx.shadowBlur=24;ctx.shadowOffsetY=8;
  ctx.fillStyle='#000';ctx.fillRect(x,y,w,h);ctx.restore();
}

window.render=function(t){
  t=((+t%8)+8)%8;
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  bg();
  if(!ok)return;
  composeScene(t);
  // 完整竖幅原图（360×640，等比，不裁人物）
  const LX=72,LY=40,LW=360,LH=640;
  panel(LX,LY,LW,LH);
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.drawImage(comp,0,0,SW,SH,LX,LY,LW,LH);
  // 河湾局部（源图 645,690 起 435×315）
  const D={sx:645,sy:690,sw:435,sh:315};
  const RX=496,RYp=40,RW=704,RH=510;
  panel(RX,RYp,RW,RH);
  ctx.drawImage(comp,D.sx,D.sy,D.sw,D.sh,RX,RYp,RW,RH);
  // 在原图上标出局部来源
  const k=LW/SW;
  ctx.strokeStyle='rgba(255,222,176,0.42)';ctx.lineWidth=1;
  ctx.strokeRect(LX+D.sx*k+0.5,LY+D.sy*k+0.5,D.sw*k-1,D.sh*k-1);
  ctx.strokeStyle='rgba(255,222,176,0.22)';
  ctx.strokeRect(RX+0.5,RYp+0.5,RW-1,RH-1);
  // 文字
  ctx.fillStyle='#f2e4cb';ctx.textBaseline='alphabetic';
  ctx.font='40px "CJKSerif", serif';
  ctx.fillText('城灯初上',RX,RYp+RH+62);
  ctx.fillStyle='rgba(214,206,226,0.88)';
  ctx.font='23px "CJKSerif", serif';
  ctx.fillText('远处窗灯先亮，近岸的光落进河里。',RX,RYp+RH+104);
};

async function boot(){
  const f=new FontFace('CJKSerif','url(assets/serif.otf)');
  const pf=f.load().then(ff=>{document.fonts.add(ff);});
  const pi=new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src='assets/source.png';});
  const r=await Promise.all([pf,pi]);
  img=r[1];
  if(img.decode){try{await img.decode();}catch(e){}}
  await document.fonts.ready;
  prepare();ok=true;
  window.render(0);
  window.READY=true;
}
window.render(0);
boot().catch(e=>{console.error(e);});
})();
</script>
</body>
</html>
