<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>沿着海岸，把一天收好</title>
<style>html,body{margin:0;background:#1d2a33}canvas{display:block;width:1280px;height:720px}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
window.CFG={outW:1280,outH:720,fps:24,dur:13};
window.READY=false;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const img=new Image();img.src='assets/source.webp';
const FONT='"FilmSerif", serif';
// ---------- 布局数据（全部渲染与诊断共用） ----------
const B=12; // 统一白边
// 源裁切：白框内侧的纯照片区域（已避开邻图与桌面）
const CARDS=[
 {name:'车站',src:[194,286,558,344],x:54, y:185,w:354,h:0},
 {name:'小巷',src:[189,700,570,353],x:440,y:222,w:354,h:0},
 {name:'海边',src:[173,1124,593,381],x:828,y:162,w:404,h:0}
];
CARDS.forEach(c=>{const iw=c.w-2*B;c.h=Math.round(iw*c.src[3]/c.src[2])+2*B;});
const NODES=[[40,652],[231,606],[430,662],[617,622],[820,668],[1030,604],[1120,640]];
const ST=[1,3,5]; // 站点节点索引
const TITLE={text:'沿着海岸，把一天收好',x:54,y:72,size:40};
// 路线采样（Catmull-Rom）
const PATH=[];const NODE_L=[];
(function(){
 const P=NODES;let L=0,prev=null;
 for(let i=0;i<P.length-1;i++){
  const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)];
  for(let k=0;k<=40;k++){if(i>0&&k==0)continue;const t=k/40,t2=t*t,t3=t2*t;
   const f=(a,b,c,d)=>0.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);
   const q=[f(p0[0],p1[0],p2[0],p3[0]),f(p0[1],p1[1],p2[1],p3[1])];
   if(prev)L+=Math.hypot(q[0]-prev[0],q[1]-prev[1]);
   if(k==0)NODE_L[i]=L;PATH.push([q[0],q[1],L]);prev=q;}
  NODE_L[i+1]=L;}
})();
const TOTAL=PATH[PATH.length-1][2];
function at(len){len=Math.max(0,Math.min(TOTAL,len));let lo=0,hi=PATH.length-1;
 while(hi-lo>1){const m=(lo+hi)>>1;if(PATH[m][2]<len)lo=m;else hi=m;}
 const a=PATH[lo],b=PATH[hi],f=(len-a[2])/((b[2]-a[2])||1);
 return {x:a[0]+(b[0]-a[0])*f,y:a[1]+(b[1]-a[1])*f,ang:Math.atan2(b[1]-a[1],b[0]-a[0])};}
const SL=ST.map(i=>NODE_L[i]);
const ss=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);};
const KEYS=[[0,0],[0.8,0],[2.0,SL[0]],[4.3,SL[0]],[5.4,SL[1]],[7.7,SL[1]],[8.8,SL[2]],[11.8,SL[2]],[13,0]];
function markerL(t){for(let i=0;i<KEYS.length-1;i++){const a=KEYS[i],b=KEYS[i+1];
 if(t<=b[0])return a[1]+(b[1]-a[1])*ss((t-a[0])/(b[0]-a[0]));}return 0;}
const OPEN=[[2.0,2.8,12.4,12.85],[5.4,6.2,12.05,12.5],[8.8,9.8,11.8,12.2]];
function openAmt(i,t){const o=OPEN[i];return ss((t-o[0])/(o[1]-o[0]))*(1-ss((t-o[2])/(o[3]-o[2])));}
function phase(t){if(t<0.8)return'起点';if(t<2)return'前往车站';if(t<4.3)return'车站展开';if(t<5.4)return'前往小巷';
 if(t<7.7)return'小巷展开';if(t<8.8)return'前往海边';if(t<9.8)return'海边展开';if(t<11.8)return'整页停留';return'返回起点·合拢';}
// ---------- 静态桌面（一次生成，不随时间累积） ----------
let DESK=null;
function rnd(s){return function(){s=(s*16807)%2147483647;return s/2147483647;};}
function buildDesk(){
 const d=document.createElement('canvas');d.width=1280;d.height=720;const g=d.getContext('2d');
 g.fillStyle='#cfe4ef';g.fillRect(0,0,1280,720);
 // 陆地
 g.fillStyle='#f1ecdc';g.beginPath();g.moveTo(0,720);g.lineTo(0,520);
 const r=rnd(7);let pts=[];for(let x=0;x<=1280;x+=20){pts.push([x,560+Math.sin(x/90)*34+Math.sin(x/23)*8+r()*6]);}
 pts.forEach(p=>g.lineTo(p[0],p[1]));g.lineTo(1280,720);g.closePath();g.fill();
 g.strokeStyle='rgba(70,120,160,.45)';g.lineWidth=1.5;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();
 g.strokeStyle='rgba(70,120,160,.18)';g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]-10):g.moveTo(p[0],p[1]-10));g.stroke();
 // 街道细网
 g.strokeStyle='rgba(150,140,120,.22)';g.lineWidth=1;
 for(let i=0;i<70;i++){const x=r()*1280,y=600+r()*120,a=r()*3,l=20+r()*60;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
 // 海上等深线
 g.strokeStyle='rgba(255,255,255,.35)';for(let k=1;k<4;k++){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]-k*26):g.moveTo(p[0],p[1]-k*26));g.stroke();}
 // 纸纹
 const id=g.getImageData(0,0,1280,720),D=id.data;for(let i=0;i<D.length;i+=4){const n=(r()-.5)*10;D[i]+=n;D[i+1]+=n;D[i+2]+=n;}g.putImageData(id,0,0);
 // 折痕
 [[427,0,427,720],[853,0,853,720],[0,400,1280,400]].forEach(l=>{g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=2;g.beginPath();g.moveTo(l[0],l[1]);g.lineTo(l[2],l[3]);g.stroke();
  g.strokeStyle='rgba(60,90,110,.08)';g.lineWidth=2;g.beginPath();g.moveTo(l[0]+2,l[1]+(l[1]==l[3]?2:0));g.lineTo(l[2]+2,l[3]+(l[1]==l[3]?2:0));g.stroke();});
 // 麻绳（固定）
 g.strokeStyle='#b89668';g.lineWidth=3;g.beginPath();g.moveTo(1280,20);g.bezierCurveTo(1180,60,1250,90,1180,92);g.stroke();
 g.strokeStyle='rgba(90,60,30,.3)';g.lineWidth=1;g.setLineDash([2,3]);g.stroke();g.setLineDash([]);
 // 铅笔（固定）
 g.save();g.translate(1150,30);g.rotate(-0.12);g.fillStyle='rgba(0,0,0,.12)';g.fillRect(3,4,110,9);
 g.fillStyle='#2f5f9c';g.fillRect(0,0,100,9);g.fillStyle='#e7cfa4';g.beginPath();g.moveTo(100,0);g.lineTo(116,4.5);g.lineTo(100,9);g.fill();g.restore();
 // 地图边
 const vg=g.createRadialGradient(640,360,300,640,360,820);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(20,40,60,.18)');g.fillStyle=vg;g.fillRect(0,0,1280,720);
 DESK=d;}
// ---------- 卡片（沿长边中线对折的相纸） ----------
function tri(im,a,b,c,A,B,C){
 const det=a[0]*(b[1]-c[1])+b[0]*(c[1]-a[1])+c[0]*(a[1]-b[1]);if(Math.abs(det)<.00001)return;
 const co=(x,y,z)=>[(x*(b[1]-c[1])+y*(c[1]-a[1])+z*(a[1]-b[1]))/det,(x*(c[0]-b[0])+y*(a[0]-c[0])+z*(b[0]-a[0]))/det,(x*(b[0]*c[1]-c[0]*b[1])+y*(c[0]*a[1]-a[0]*c[1])+z*(a[0]*b[1]-b[0]*a[1]))/det];
 const x=co(A[0],B[0],C[0]),y=co(A[1],B[1],C[1]);ctx.save();ctx.beginPath();ctx.moveTo(...A);ctx.lineTo(...B);ctx.lineTo(...C);ctx.closePath();ctx.clip();ctx.transform(x[0],y[0],x[1],y[1],x[2],y[2]);ctx.drawImage(im,0,0);ctx.restore();
}
function card(i,o){
 const c=CARDS[i],x=c.x,y=c.y,w=c.w,h=c.h,mid=y+h/2,iw=w-2*B,ih=h-2*B,s=c.src;
 const lift=i==2?o*0.025:0;
 ctx.save();ctx.translate(x+w/2,mid);ctx.scale(1+lift,1+lift);ctx.translate(-(x+w/2),-mid);
 const a=Math.PI*(1-o),cs=Math.cos(a);
 // 下半张（贴桌）
 ctx.save();ctx.shadowColor='rgba(30,50,70,.28)';ctx.shadowBlur=10;ctx.shadowOffsetY=3;
 ctx.fillStyle='#fbf9f3';ctx.fillRect(x,mid,w,h/2);ctx.restore();
 const fu=(mid-(y+B))/ih;
 ctx.drawImage(img,s[0],s[1]+s[3]*fu,s[2],s[3]*(1-fu),x+B,mid,iw,y+h-B-mid);
 // 上半张是固定在中线上的完整纸面，以透视投影旋转，不再纵向压扁照片。
 const hh=h/2,tex=document.createElement('canvas');tex.width=w;tex.height=Math.ceil(hh);
 const tg=tex.getContext('2d');tg.fillStyle=cs>=0?'#fbf9f3':'#f2ecdd';tg.fillRect(0,0,w,hh);
 if(cs>=0)tg.drawImage(img,s[0],s[1],s[2],s[3]*fu,B,B,iw,hh-B);
 else {tg.strokeStyle='rgba(120,100,80,.35)';tg.lineWidth=1;for(let j=0;j<3;j++){tg.beginPath();tg.moveTo(w*.12,hh*.3+j*hh*.16);tg.lineTo(w*.6,hh*.3+j*hh*.16);tg.stroke();}tg.strokeRect(w*.76,hh*.2,w*.13,hh*.42);}
 const proj=(u,v)=>{const z=hh*(1-v)*Math.sin(a),f=900/(900-z);return [x+w/2+(u-.5)*w*f,mid-hh*(1-v)*cs*f-z*.22];};
 ctx.save();ctx.shadowColor='rgba(30,50,70,.3)';ctx.shadowBlur=8+18*Math.sin(a);ctx.shadowOffsetY=4+14*Math.sin(a);ctx.fillStyle='#f2ecdd';ctx.beginPath();[[0,0],[1,0],[1,1],[0,1]].forEach((q,j)=>{const p=proj(...q);j?ctx.lineTo(...p):ctx.moveTo(...p)});ctx.closePath();ctx.fill();ctx.restore();
 for(let row=0;row<12;row++){const v0=row/12,v1=(row+1)/12;const q0=proj(0,v0),q1=proj(1,v0),q2=proj(1,v1),q3=proj(0,v1);tri(tex,[0,v0*hh],[w,v0*hh],[w,v1*hh],q0,q1,q2);tri(tex,[0,v0*hh],[w,v1*hh],[0,v1*hh],q0,q2,q3);}
 ctx.save();ctx.fillStyle='rgba(20,30,40,'+(.22*Math.sin(a))+')';ctx.beginPath();[[0,0],[1,0],[1,1],[0,1]].forEach((q,j)=>{const p=proj(...q);j?ctx.lineTo(...p):ctx.moveTo(...p)});ctx.closePath();ctx.fill();ctx.restore();
 // 折痕高光
 ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(x,mid-0.5,w,1);
 ctx.restore();
}
function ticket(p){
 ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang*0.5-0.08);
 ctx.fillStyle='rgba(20,40,60,.3)';ctx.beginPath();ctx.ellipse(3,22,22,6,0,0,7);ctx.fill();
 ctx.translate(0,-18);
 ctx.fillStyle='#e9694f';ctx.beginPath();ctx.moveTo(-18,-14);ctx.lineTo(10,-14);ctx.lineTo(22,0);ctx.lineTo(10,14);ctx.lineTo(-18,14);ctx.closePath();ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,.8)';ctx.setLineDash([3,3]);ctx.strokeRect(-14,-10,22,20);ctx.setLineDash([]);
 ctx.fillStyle='#f6efe0';ctx.beginPath();ctx.arc(12,0,3.5,0,7);ctx.fill();
 ctx.restore();
 // 钉点（标记与路线接触处）
 ctx.fillStyle='#b8442f';ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();
}
const LABEL_LAYOUT=[];
function render(t){
 if(!DESK)buildDesk();
 t=((t%13)+13)%13;
 ctx.drawImage(DESK,0,0);
 // 标题
 ctx.font=TITLE.size+'px '+FONT;ctx.fillStyle='#1f3c5a';ctx.textBaseline='alphabetic';ctx.fillText(TITLE.text,TITLE.x,TITLE.y);
 const L=markerL(t),m=at(L);
 // 引线：站点→对应照片底边中心
 ST.forEach((ni,i)=>{const c=CARDS[i],o=openAmt(i,t),n=NODES[ni];
  ctx.strokeStyle='rgba(31,60,90,'+(0.25+0.5*o)+')';ctx.lineWidth=1.2;ctx.setLineDash([4,5]);
  ctx.beginPath();ctx.moveTo(n[0],n[1]-10);ctx.lineTo(c.x+c.w/2,c.y+c.h+4);ctx.stroke();ctx.setLineDash([]);});
 // 路线
 ctx.strokeStyle='rgba(31,60,90,.55)';ctx.lineWidth=2;ctx.setLineDash([6,6]);ctx.beginPath();PATH.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.setLineDash([]);
 ctx.strokeStyle='#e9694f';ctx.lineWidth=3;ctx.beginPath();for(const p of PATH){if(p[2]>L)break;p[2]?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}ctx.lineTo(m.x,m.y);ctx.stroke();
 // 起点
 ctx.fillStyle='#1f3c5a';ctx.beginPath();ctx.arc(NODES[0][0],NODES[0][1],5,0,7);ctx.fill();
 // 卡片
 for(let i=0;i<3;i++)card(i,openAmt(i,t));
 // 站点与标签
 ctx.font='30px '+FONT;LABEL_LAYOUT.length=0;
 ST.forEach((ni,i)=>{const n=NODES[ni],o=openAmt(i,t);
  ctx.fillStyle='#fbf9f3';ctx.beginPath();ctx.arc(n[0],n[1],9,0,7);ctx.fill();
  ctx.strokeStyle=o>0.5?'#e9694f':'#1f3c5a';ctx.lineWidth=3;ctx.stroke();
  const tw=ctx.measureText(CARDS[i].name).width,lx=n[0]+18,ly=n[1]+50;
  LABEL_LAYOUT.push({name:CARDS[i].name,x:lx-8,y:ly-32,w:tw+16,h:42});
  ctx.fillStyle='rgba(251,249,243,'+(0.55+0.4*o)+')';ctx.fillRect(lx-8,ly-32,tw+16,42);
  if(o>0.01){ctx.fillStyle='rgba(233,105,79,'+o+')';ctx.fillRect(lx-8,ly+6,(tw+16)*o,3);}
  ctx.fillStyle='#1f3c5a';ctx.fillText(CARDS[i].name,lx,ly);});
 ticket(m);
}
window.render=render;
window.FILM_DIAGNOSTICS=function(t){t=t||0;const L=markerL(((t%13)+13)%13),m=at(L);
 return {phase:phase(t),marker:{x:m.x,y:m.y},open:[0,1,2].map(i=>openAmt(i,t)),
  cards:CARDS.map(c=>({name:c.name,x:c.x,y:c.y,w:c.w,h:c.h,src:c.src,border:B})),stations:ST.map(i=>NODES[i]),labels:LABEL_LAYOUT.slice(),title:TITLE};};
const ff=new FontFace('FilmSerif','url(assets/serif.otf)');
Promise.all([ff.load().then(f=>document.fonts.add(f)),new Promise((r,j)=>{if(img.complete&&img.naturalWidth)r();else{img.onload=r;img.onerror=j;}})])
.then(()=>document.fonts.ready).then(()=>{buildDesk();render(0);window.READY=true;});
</script></body></html>
